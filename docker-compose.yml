version: '3.8'

services:
  mocker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mocker
    ports:
      - "80:80"
    volumes:
      - mocker-data:/data
    environment:
      - DATABASE_PATH=/data/mocker.db
      - DATABASE_MAX_OPEN_CONNS=25
      - DATABASE_MAX_IDLE_CONNS=5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  mocker-data:
    driver: local